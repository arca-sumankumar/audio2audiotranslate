# STTS ASR worker configuration

logLevel: INFO                  # DEBUG | INFO | WARNING | ERROR
natsUrl: nats://broker:4222

server:
  host: 0.0.0.0
  port: 50020                   # internal health port (safe range 49152-65535)

audio:
  sampleRate: 16000             # 8000-48000 Hz
  chunkDurationMs: 300          # 200-500 ms

model:
  backend: mock                 # mock | whisper (faster-whisper int8)
  offlinePath: /models
  languages: [en, bn, gu, hi, kn, ml, mr, pa, ta, te, ur]

asr:
  inferenceThreads: 2           # >= 1; thread pool for model inference
  replicaCount: 1               # >= 1; sessions sharded by sessionId hash
  maxRedeliveries: 3            # broker redeliveries before DLQ
