apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: stts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: stts/ingest:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50010
          envFrom:
            - configMapRef:
                name: stts-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 50010
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          hostPath:
            path: /opt/stts/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: stts
spec:
  type: NodePort
  selector:
    app: ingest
  ports:
    - name: http
      port: 50010
      targetPort: 50010
      nodePort: 30010
