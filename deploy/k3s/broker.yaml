# NATS JetStream broker (lab). Persistent storage via hostPath (single-node).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: stts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: nats-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      volumes:
        - name: nats-data
          hostPath:
            path: /opt/stts/nats
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: stts
spec:
  selector:
    app: broker
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
