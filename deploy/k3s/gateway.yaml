apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: stts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: stts/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 51000
          envFrom:
            - configMapRef:
                name: stts-config
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 51000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          hostPath:
            path: /opt/stts/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: stts
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 51000
      targetPort: 51000
      nodePort: 30051
