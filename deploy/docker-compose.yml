# STTS laptop deployment - docker compose
# Brings up: NATS JetStream broker + 6 services + one-shot bootstrap.

name: stts

x-service-defaults: &service-defaults
  build:
    context: ..
    dockerfile: services/ingest/Dockerfile
  restart: unless-stopped

services:
  broker:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # NATS client (host debugging only; internal otherwise)
      - "8222:8222"   # NATS monitor
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  setup:
    image: stts/tools:local
    build:
      context: ..
      dockerfile: Dockerfile.tools
    command: ["python", "/app/scripts/setup_nats.py"]
    environment:
      - NATS_URL=nats://broker:4222
    volumes:
      - ../scripts:/app/scripts:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"
    profiles:
      - tools

  ingest:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    ports:
      - "50010:50010"
    volumes:
      - data:/data
    depends_on:
      broker:
        condition: service_healthy

  asr:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/asr/Dockerfile
    depends_on:
      broker:
        condition: service_healthy

  mt:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/mt/Dockerfile
    depends_on:
      broker:
        condition: service_healthy

  tts:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/tts/Dockerfile
    depends_on:
      broker:
        condition: service_healthy

  forwarder:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/forwarder/Dockerfile
    depends_on:
      broker:
        condition: service_healthy

  gateway:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "51000:51000"
    volumes:
      - data:/data
    depends_on:
      broker:
        condition: service_healthy

  demo:
    image: stts/demo:local
    build:
      context: ..
      dockerfile: services/demo/Dockerfile
    ports:
      - "50060:50060"
    environment:
      - STTS_INGEST_URL=http://ingest:50010
      - STTS_GATEWAY_URL=http://gateway:51000
      - STTS_UPLOAD_DIR=/data/uploads
    volumes:
      - data:/data
    depends_on:
      broker:
        condition: service_healthy

  smoke:
    image: stts/tools:local
    command: ["python", "/app/scripts/smoke_test.py"]
    environment:
      - STTS_INGEST_URL=http://ingest:50010
      - STTS_GATEWAY_URL=http://gateway:51000
    volumes:
      - ../scripts:/app/scripts:ro
      - data:/data
    depends_on:
      - ingest
      - gateway
    profiles:
      - tools

volumes:
  nats-data:
  data:
